name: Security Secret Scan

on:
  pull_request:
    paths:
      - 'scripts/workspace-guard.mjs'
      - '.workspace-guard-baseline.json'
      - '.gitignore'
      - '.github/workflows/workspace-guard-pr.yml'
      - 'deploy/**'
      - 'frontend/**'
      - 'contracts/**'
      - 'docs/WORKSPACE_GUARD.md'
    paths-ignore:
      - 'artifacts/**'
      - 'cache/**'
      - 'reports/**'
      - 'coverage/**'
      - 'frontend/.next/**'
      - '**/*.tsbuildinfo'
  push:
    branches:
      - main

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Run secret scan (tracked files)
        run: npm run security:scan-secrets:all
